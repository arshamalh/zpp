# Fine for a single-node demo cluster. In production use a managed Postgres/TimescaleDB
# or an operator such as CloudNativePG, and keep the password in a real secret store.
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: peakpilot
type: Opaque
stringData:
  POSTGRES_USER: peakpilot
  POSTGRES_PASSWORD: change-me
  POSTGRES_DB: peakpilot
  DATABASE_URL: postgres://peakpilot:change-me@postgres/peakpilot
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: peakpilot
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom: [{ secretRef: { name: postgres } }]
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ name: pg, containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "peakpilot"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: peakpilot
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports: [{ name: pg, port: 5432, targetPort: pg }]
