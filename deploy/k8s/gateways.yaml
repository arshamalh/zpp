# Simulated sites. In real life these run on hardware at the customer, not in the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gw-depot
  namespace: peakpilot
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: gw-depot } }
  template:
    metadata: { labels: { app.kubernetes.io/name: gw-depot, app.kubernetes.io/component: gateway-sim } }
    spec:
      containers:
        - name: gateway
          image: ghcr.io/arshamalh/peakpilot:latest
          command: ["/usr/local/bin/gateway-sim"]
          env:
            - { name: SITE_ID, value: depot-utrecht }
            - { name: PROFILE, value: depot }
            - { name: SEED, value: "7" }
            - { name: MQTT_HOST, value: mosquitto }
            - { name: DROP_ACK_PCT, value: "20" }
            - { name: LOG_JSON, value: "true" }
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { memory: 64Mi }
---
